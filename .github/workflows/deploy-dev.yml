name: Deploy dev to Cloudflare

on:
  push:
    branches:
      - dev
    paths:
      - 'index.html'
      - 'app.js'
      - 'audit-ui.js'
      - 'styles.css'
      - '.assetsignore'
      - 'worker/**'
      - '.github/workflows/deploy-dev.yml'
      - 'PROJECT_STATE.md'

permissions:
  contents: read

concurrency:
  group: cloudflare-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ALLOWED_TELEGRAM_USER_IDS: ${{ secrets.ALLOWED_TELEGRAM_USER_IDS }}
      OWNER_TELEGRAM_USER_ID: ${{ secrets.OWNER_TELEGRAM_USER_ID }}
      DB_NAME: tg-tips-calculator-dev
      WORKER_NAME: tg-tips-calculator-dev

    steps:
      - uses: actions/checkout@v6

      - name: Check deployment secrets
        id: secrets
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$TELEGRAM_BOT_TOKEN" || -z "$ALLOWED_TELEGRAM_USER_IDS" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment is prepared but waiting for the required GitHub Actions secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package.json

      - name: Install Wrangler
        if: steps.secrets.outputs.ready == 'true'
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Prepare static assets
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-dev
          mkdir dist-dev
          cp index.html app.js audit-ui.js styles.css dist-dev/

      - name: Create D1 if needed and build CI config
        if: steps.secrets.outputs.ready == 'true'
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail

          get_db_id() {
            npx wrangler d1 list --json > /tmp/d1.json
            DB_NAME="$DB_NAME" node <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/d1.json', 'utf8'));
          const list = Array.isArray(raw) ? raw : (raw.result || raw.databases || []);
          const db = list.find(item => item.name === process.env.DB_NAME);
          process.stdout.write(db ? String(db.uuid || db.id || db.database_id || '') : '');
          NODE
          }

          DB_ID="$(get_db_id)"
          if [[ -z "$DB_ID" ]]; then
            npx wrangler d1 create "$DB_NAME"
            DB_ID="$(get_db_id)"
          fi
          if [[ -z "$DB_ID" ]]; then
            echo "Could not resolve D1 database ID for $DB_NAME" >&2
            exit 1
          fi

          EFFECTIVE_ALLOWED_TELEGRAM_USER_IDS="$ALLOWED_TELEGRAM_USER_IDS"
          if [[ -n "$OWNER_TELEGRAM_USER_ID" ]]; then
            EFFECTIVE_ALLOWED_TELEGRAM_USER_IDS="${EFFECTIVE_ALLOWED_TELEGRAM_USER_IDS},${OWNER_TELEGRAM_USER_ID}"
          fi

          cat > wrangler.ci.toml <<EOF
          name = "$WORKER_NAME"
          main = "src/index.js"
          compatibility_date = "2026-09-12"

          [vars]
          ALLOWED_ORIGINS = ""
          ALLOWED_TELEGRAM_USER_IDS = "$EFFECTIVE_ALLOWED_TELEGRAM_USER_IDS"

          [assets]
          directory = "../dist-dev"
          run_worker_first = ["/api/*"]

          [[d1_databases]]
          binding = "DB"
          database_name = "$DB_NAME"
          database_id = "$DB_ID"
          migrations_dir = "migrations"
          EOF

      - name: Apply D1 migrations
        if: steps.secrets.outputs.ready == 'true'
        working-directory: worker
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.ci.toml

      - name: Deploy dev Worker and static assets
        if: steps.secrets.outputs.ready == 'true'
        working-directory: worker
        run: npx wrangler deploy --config wrangler.ci.toml

      - name: Configure Telegram bot token secret
        if: steps.secrets.outputs.ready == 'true'
        working-directory: worker
        shell: bash
        run: printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --config wrangler.ci.toml

      - name: Configure owner Telegram ID secret
        if: steps.secrets.outputs.ready == 'true'
        working-directory: worker
        shell: bash
        run: |
          if [[ -n "$OWNER_TELEGRAM_USER_ID" ]]; then
            printf '%s' "$OWNER_TELEGRAM_USER_ID" | npx wrangler secret put OWNER_TELEGRAM_USER_ID --config wrangler.ci.toml
          else
            echo "OWNER_TELEGRAM_USER_ID is not configured yet; owner-only actions stay fail-closed."
          fi
