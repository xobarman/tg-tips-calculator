name: Tests

on:
  push:
    branches:
      - main
      - dev
      - 'release/**'
      - 'feature/**'
      - 'beta/**'
  pull_request:
    branches:
      - dev
      - main

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check src/index.js
      - run: node --check src/audit-history.js
      - run: node --check ../audit-ui.js
